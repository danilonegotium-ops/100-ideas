<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Is It Friday Yet?</title>
  <meta name="description" content="A simple one-page site that tells you, dramatically, whether it is Friday yet." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap iifw-wrap">
    <h1>Is It Friday Yet?</h1>
    <p class="tagline">A simple one-page site that tells you, dramatically, whether it is Friday yet.</p>

    <div class="card iifw-card">
      <div class="iifw-answer" id="answer">...</div>
      <p class="iifw-message" id="message">Checking the calendar&hellip;</p>
      <p class="iifw-date muted mono" id="today-date"></p>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
