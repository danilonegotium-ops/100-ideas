<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>No-Code Website Audit — instant SEO &amp; speed checklist</title>
  <meta name="description" content="Paste a URL and get an instant checklist of what to fix for better SEO and technical health. No signup, no code." />
  <link rel="stylesheet" href="theme.css" />
  <style>
    .score-badge {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin: 0.25rem 0 1rem;
    }
    .score-badge .num { font-size: 2.4rem; font-weight: 800; }
    .score-badge .of { color: var(--text-muted); font-size: 1rem; }

    .check-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
    .check {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
    }
    .check .icon {
      flex: none;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #062b1c;
    }
    .check.pass .icon { background: var(--accent); }
    .check.warn .icon { background: #fbbf24; }
    .check.fail .icon { background: var(--danger); color: #2b0606; }
    .check .body { flex: 1; }
    .check .label { font-weight: 600; margin-bottom: 0.15rem; }
    .check .message { color: var(--text-muted); font-size: 0.9rem; }

    #error-box { color: var(--danger); font-size: 0.9rem; margin-top: 0.75rem; display: none; }
    #loading { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.75rem; display: none; }
    .pagespeed-note { margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 0.85rem; }
  </style>
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>No-Code Website Audit</h1>
    <p class="tagline">Put in a URL and get a list of things to fix for better SEO and technical health. No signup, no code.</p>

    <div class="card stack fade-in">
      <form id="audit-form" class="stack">
        <div>
          <label for="url-input">Website URL</label>
          <input type="text" id="url-input" name="url" placeholder="example.com" autocomplete="off" required />
        </div>
        <button type="submit" id="submit-btn">Run Audit</button>
      </form>
      <p id="loading">Fetching and checking the page&hellip;</p>
      <p id="error-box"></p>
    </div>

    <div class="card" id="results" style="display:none; margin-top: 1rem;">
      <h2 style="margin-top:0;">Results for <span id="result-url" class="mono"></span></h2>
      <div class="score-badge">
        <span class="num" id="score-num">-</span>
        <span class="of">/ 10</span>
      </div>
      <div class="check-list" id="check-list"></div>
      <div class="pagespeed-note" id="pagespeed-note"></div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
