<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON to Serbian Cyrillic</title>
  <meta name="description" content="Transliterate Serbian Latin text (or JSON string values) into Serbian Cyrillic. A niche tool for developers localizing apps for the Serbian market." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>JSON to Serbian Cyrillic</h1>
    <p class="tagline">Paste JSON (or plain text) written in Serbian Latin — get it back in Serbian Cyrillic. Handles digraphs (lj, nj, dž) and diacritics (č, ć, š, ž, đ) correctly.</p>

    <div class="card stack fade-in">
      <div class="row" style="align-items: center; justify-content: space-between;">
        <div class="row" style="gap: 1.25rem; align-items: center;">
          <label class="mode-toggle">
            <input type="radio" name="mode" value="json" id="mode-json" checked />
            JSON mode
          </label>
          <label class="mode-toggle">
            <input type="radio" name="mode" value="text" id="mode-text" />
            Plain text mode
          </label>
        </div>
        <label class="mode-toggle" id="keys-toggle-wrap">
          <input type="checkbox" id="transliterate-keys" />
          Transliterate keys too
        </label>
      </div>

      <div>
        <label for="input">Input (Serbian Latin)</label>
        <textarea id="input" rows="10" placeholder='{"pozdrav": "Zdravo, kako si? Ovo je čđšžćnjlj test."}'></textarea>
      </div>

      <div class="row">
        <button id="convert-btn" type="button">Convert to Cyrillic</button>
        <button id="copy-btn" type="button" class="secondary">Copy result</button>
        <button id="clear-btn" type="button" class="secondary">Clear</button>
      </div>

      <div id="error" class="error" hidden></div>

      <div>
        <label for="output">Output (Serbian Cyrillic)</label>
        <textarea id="output" rows="10" readonly placeholder="Cyrillic output appears here..."></textarea>
      </div>
    </div>

    <details class="card" style="margin-top: 1rem;">
      <summary>Latin &rarr; Cyrillic mapping table</summary>
      <div id="mapping-table"></div>
    </details>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
