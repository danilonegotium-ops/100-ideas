<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plant Care Guide</title>
  <meta name="description" content="Pick a houseplant and your city, and get a watering schedule adjusted for real local humidity and temperature (via Open-Meteo, free, no key). Mark plants as watered and track when the next watering is due." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Plant Care Guide</h1>
    <p class="tagline">Pick a plant and your city — the base watering interval gets nudged up or down using your city's real current humidity and temperature (via Open-Meteo, free, no account).</p>

    <div class="card fade-in">
      <h2>Add a plant</h2>
      <div class="stack">
        <div>
          <label for="plant-select">Plant</label>
          <select id="plant-select"></select>
        </div>
        <div>
          <label for="city-input">Your city</label>
          <input type="text" id="city-input" placeholder="e.g. Novi Sad" />
        </div>
        <div class="row">
          <button type="button" id="add-plant-btn" class="btn">Add plant &amp; check weather</button>
        </div>
        <p class="muted" id="add-status" role="status"></p>
      </div>
    </div>

    <div class="card">
      <h2>My plants</h2>
      <div class="pcg-plant-list" id="plant-list"></div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
