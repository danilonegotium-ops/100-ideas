<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dummy Data Generator (Balkan)</title>
  <meta name="description" content="Generate random user profiles, names, and addresses specifically for the Balkan region — realistic Serbian names, cities, +381 phone numbers, and emails." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Dummy Data Generator (Balkan)</h1>
    <p class="tagline">Generate random fake user profiles with realistic Serbian/Balkan names, cities, phone numbers, and emails — for testing forms, demos, and seed data.</p>

    <div class="card fade-in">
      <div class="row" style="align-items: flex-end;">
        <div style="flex: 1; min-width: 140px;">
          <label for="count">How many profiles? (1&ndash;100)</label>
          <input type="number" id="count" min="1" max="100" value="10" />
        </div>
        <button id="generate-btn" type="button">Generate</button>
      </div>
    </div>

    <div class="card" style="margin-top: 1rem;">
      <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <span class="muted" id="summary"></span>
        <div class="row">
          <button id="copy-json-btn" type="button" class="secondary">Copy as JSON</button>
          <button id="copy-csv-btn" type="button" class="secondary">Copy as CSV</button>
        </div>
      </div>
      <div id="table-wrap" class="table-scroll">
        <table id="result-table">
          <thead>
            <tr>
              <th>First name</th>
              <th>Last name</th>
              <th>City</th>
              <th>Phone</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
