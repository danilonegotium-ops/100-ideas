<!doctype html>
<html lang="en" data-accent="blue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favicon Generator</title>
  <meta name="description" content="Turn any image into all the favicon sizes modern browsers and devices expect, generated and downloaded entirely in your browser." />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="tier2.css" />
</head>
<body>
  <canvas class="mesh-bg-canvas" data-mesh-bg="rgba(96,165,250,0.5),rgba(34,211,238,0.32),rgba(167,139,250,0.28)"></canvas>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Favicon Generator</h1>
    <p class="tagline">Turn any image into all the favicon sizes modern browsers and devices expect, generated and downloaded entirely in your browser.</p>

    <div class="gradient-border">
      <div class="card stack">
        <div class="stack" data-spotlight>
          <label for="image-input">Choose a source image (square images work best)</label>
          <input type="file" id="image-input" accept="image/*" />
        </div>

        <p id="status-msg" class="muted" style="margin: 0; font-size: 0.9rem;"></p>

        <canvas id="work-canvas" hidden></canvas>

        <div id="results" class="fg-results"></div>

        <button id="download-all-btn" class="btn btn-glow" hidden>Download all sizes</button>
      </div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="tier2.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
