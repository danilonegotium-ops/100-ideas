<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Palette from Image</title>
  <meta name="description" content="Upload a photo and get a professional color palette, extracted entirely in your browser — nothing is uploaded anywhere." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Color Palette from Image</h1>
    <p class="tagline">Upload a photo and get a professional color palette, extracted entirely in your browser — nothing is uploaded anywhere.</p>

    <div class="card stack">
      <div class="stack">
        <label for="image-input">Choose an image</label>
        <input type="file" id="image-input" accept="image/*" />
      </div>

      <p id="status-msg" class="muted" style="margin: 0; font-size: 0.9rem;"></p>

      <img id="preview" class="cpi-preview" hidden alt="Uploaded preview" />
      <canvas id="work-canvas" hidden></canvas>

      <div id="swatches" class="cpi-swatches"></div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
