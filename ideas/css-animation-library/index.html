<!doctype html>
<html lang="en" data-accent="violet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS Animation Library</title>
  <meta name="description" content="A collection of copy-paste CSS animations for web developers. Click any card to copy the @keyframes and class straight to your clipboard." />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="tier2.css" />
</head>
<body>
  <canvas class="mesh-bg-canvas" data-mesh-bg="rgba(167,139,250,0.5),rgba(96,165,250,0.3),rgba(251,113,133,0.25)"></canvas>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>CSS Animation Library</h1>
    <p class="tagline">A collection of copy-paste CSS animations for web developers. Click "Copy CSS" on any card to grab the exact code.</p>

    <div class="gradient-border">
      <div class="card" data-spotlight>
        <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label for="search" style="margin: 0;">Filter</label>
          <span class="muted mono" id="count"></span>
        </div>
        <input type="text" id="search" placeholder="Search animations (e.g. fade, bounce, spin)..." />
      </div>
    </div>

    <div class="anim-grid" id="grid"></div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="tier2.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
