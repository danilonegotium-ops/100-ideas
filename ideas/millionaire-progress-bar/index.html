<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Millionaire Progress Bar</title>
  <meta name="description" content="Enter your current savings and watch a progress bar toward one million, saved locally so it's there next time you check." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Millionaire Progress Bar</h1>
    <p class="tagline">Enter your current savings and watch a progress bar toward one million, saved locally so it's there next time you check.</p>

    <div class="card stack">
      <div class="stack">
        <label for="savings">Current savings (any currency — just the number)</label>
        <div class="row">
          <input type="number" id="savings" min="0" step="any" placeholder="e.g. 42500" />
          <button id="save-btn" class="btn">Update</button>
        </div>
      </div>

      <div class="mpb-bar-track">
        <div class="mpb-bar-fill" id="bar-fill"></div>
      </div>

      <div class="row mpb-stats">
        <span id="percent-label" class="mpb-percent">0%</span>
        <span id="remaining-label" class="muted mono"></span>
      </div>

      <p id="milestone-message" class="mpb-message muted"></p>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
