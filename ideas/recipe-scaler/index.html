<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Scaler</title>
  <meta name="description" content="Paste a recipe and automatically recalculate every ingredient for a different number of servings." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Recipe Scaler</h1>
    <p class="tagline">Paste a recipe and automatically recalculate every ingredient for a different number of servings.</p>

    <div class="card stack fade-in">
      <div class="stack">
        <label for="recipe-input">Ingredients (one per line, e.g. "200g flour" or "2 eggs")</label>
        <textarea id="recipe-input" rows="8" placeholder="200g flour&#10;2 eggs&#10;1/2 cup sugar&#10;1 tsp vanilla extract&#10;a pinch of salt"></textarea>
      </div>

      <div class="row">
        <div class="stack" style="flex: 1; min-width: 8rem;">
          <label for="original-servings">Original servings</label>
          <input type="number" id="original-servings" min="1" step="any" value="4" />
        </div>
        <div class="stack" style="flex: 1; min-width: 8rem;">
          <label for="target-servings">Target servings</label>
          <input type="number" id="target-servings" min="1" step="any" value="8" />
        </div>
      </div>

      <button id="scale-btn" class="btn">Scale recipe</button>

      <div id="result-wrap" class="stack" hidden>
        <h2>Scaled recipe (&times;<span id="factor-label"></span>)</h2>
        <ul id="result-list" class="rs-result-list mono"></ul>
        <p id="parse-warnings" class="muted" style="font-size: 0.85rem;"></p>
      </div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
