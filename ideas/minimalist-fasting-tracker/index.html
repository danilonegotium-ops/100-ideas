<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimalist Fasting Tracker</title>
  <meta name="description" content="A clean, no-ads timer for people doing intermittent fasting." />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Minimalist Fasting Tracker</h1>
    <p class="tagline">A clean, no-ads timer for people doing intermittent fasting.</p>

    <div class="card stack">
      <div id="setupView" class="stack">
        <div>
          <label for="protocolSelect">Fasting protocol</label>
          <select id="protocolSelect">
            <option value="16:8">16:8 — 16h fast, 8h eating window</option>
            <option value="18:6">18:6 — 18h fast, 6h eating window</option>
            <option value="20:4">20:4 — 20h fast, 4h eating window</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div id="customField" style="display:none;">
          <label for="customHours">Custom fast length (hours)</label>
          <input id="customHours" type="number" min="1" max="72" step="1" value="16" />
        </div>
        <button id="startBtn" type="button">Start fast</button>
      </div>

      <div id="activeView" class="stack" style="display:none; text-align:center;">
        <div class="ring-wrap">
          <svg id="progressRing" viewBox="0 0 200 200" width="220" height="220">
            <circle class="ring-track" cx="100" cy="100" r="88" />
            <circle id="ringProgress" class="ring-progress" cx="100" cy="100" r="88" />
          </svg>
          <div class="ring-center">
            <div id="ringTime" class="ring-time mono">00:00:00</div>
            <div id="ringLabel" class="muted" style="font-size:0.8rem;">elapsed</div>
          </div>
        </div>
        <div id="statusText" class="muted"></div>
        <button id="endBtn" type="button" class="secondary-btn">End fast</button>
      </div>

      <div id="historySection" class="stack">
        <h2>History</h2>
        <div id="historyList" class="stack"></div>
      </div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
