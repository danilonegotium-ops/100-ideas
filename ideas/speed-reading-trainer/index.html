<!doctype html>
<html lang="en" data-accent="lime">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speed Reading Trainer</title>
  <meta name="description" content="Paste any text and flash it back at you one word at a time (RSVP-style) so you can train your reading speed at a target WPM." />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="tier2.css" />
</head>
<body>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Speed Reading Trainer</h1>
    <p class="tagline">Paste any text, pick a target words-per-minute, and train your eyes with a rapid serial visual presentation (RSVP) reader.</p>

    <div class="card">
      <div class="stack">
        <div>
          <label for="srt-text">Text to read</label>
          <textarea id="srt-text" rows="7"></textarea>
        </div>

        <div class="row">
          <div style="flex: 1; min-width: 160px;">
            <label for="srt-wpm">Target speed (words per minute)</label>
            <input type="number" id="srt-wpm" min="100" max="1000" step="10" value="300" />
          </div>
        </div>

        <div class="reader glass" id="srt-reader" data-reveal>
          <div class="reader-word" id="srt-word">Ready</div>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="srt-progress-fill"></div>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span class="muted mono" id="srt-status">0 / 0 words</span>
          <span class="muted mono" id="srt-eta">--:--</span>
        </div>

        <div class="row">
          <button id="srt-play" class="btn-glow">Play</button>
          <button id="srt-restart" type="button">Restart</button>
        </div>
        <p class="muted" id="srt-empty-msg" hidden>Paste some text above to start training.</p>
      </div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="data.js"></script>
  <script src="tier2.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
