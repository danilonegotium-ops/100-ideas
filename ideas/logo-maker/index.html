<!doctype html>
<html lang="en" data-accent="amber">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Maker for Side Projects</title>
  <meta name="description" content="A very simple, no-fuss logo generator for people who need something fast and clean. Type a name, pick a style and color, download a real SVG." />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="tier2.css" />
</head>
<body>
  <canvas class="mesh-bg-canvas" data-mesh-bg="rgba(251,191,36,0.5),rgba(255,138,101,0.3),rgba(167,139,250,0.25)"></canvas>
  <header class="site">
    <a class="home" href="/">&larr; more tools</a>
  </header>
  <main class="wrap">
    <h1>Logo Maker for Side Projects</h1>
    <p class="tagline">A very simple, no-fuss logo generator for people who need something fast and clean.</p>

    <div class="gradient-border">
      <div class="card stack">
        <div class="stack">
          <div>
            <label for="brandName">Project / brand name</label>
            <input id="brandName" type="text" maxlength="40" placeholder="e.g. Acme Labs" value="Acme Labs" />
          </div>

          <div>
            <label for="styleSelect">Style</label>
            <select id="styleSelect">
              <option value="monogram">Monogram in shape</option>
              <option value="wordmark">Wordmark with icon</option>
              <option value="badge">Badge / emblem</option>
            </select>
          </div>

          <div>
            <label for="shapeSelect">Shape</label>
            <select id="shapeSelect">
              <option value="circle">Circle</option>
              <option value="hexagon">Hexagon</option>
              <option value="square">Rounded square</option>
            </select>
          </div>

          <div>
            <label for="colorInput">Color</label>
            <div class="row" style="align-items:center">
              <input id="colorInput" type="color" value="#34d399" style="width:64px; padding:0.25rem; flex:none" />
              <span id="colorHex" class="mono muted">#34d399</span>
            </div>
          </div>

          <div class="row">
            <button id="regenerateBtn" type="button">🎲 Randomize</button>
            <button id="downloadBtn" type="button" class="btn-glow">⬇ Download SVG</button>
          </div>
        </div>

        <div id="logoPreview" class="logo-preview" data-spotlight aria-live="polite"></div>

        <p class="muted" style="font-size:0.8rem">Everything renders client-side as a real SVG — nothing is uploaded anywhere.</p>
      </div>
    </div>
  </main>
  <footer class="site">
    <span>Built solo. No tracking, no signup required.</span>
  </footer>
  <script src="tier2.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
